# Installed as /etc/NetworkManager/dnsmasq-shared.d/lifeboard-setup.conf.
#
# NetworkManager runs dnsmasq only for "shared" connections, which on
# LifeBoard means only the setup hotspot. While it is up, every name a joined
# phone looks up resolves to the board itself, so the phone's connectivity
# check reaches the setup page (see nm-dispatcher-lifeboard-setup).
address=/#/10.42.0.1
