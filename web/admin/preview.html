<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LifeBoard layout preview</title>
<style>
  /* Page-level only. Block chrome (panels, frames, titles, padding) comes
     from ../render/board.css, the same file the wall loads, so the editor
     cannot draw a block differently from the board. The variables below must
     match render/index.html. */
  :root {
    --fg: #f2f3f5;
    --fg-dim: #9aa0a8;
    --panel: rgba(255,255,255,.04);
    --panel-line: rgba(255,255,255,.08);
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    overflow: hidden; background: transparent; color: var(--fg);
    font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
    user-select: none;
  }
  /* NO element with id="board" - app.js boots the real renderer when it finds
     one, which would start polling /api/board and paint the live layout over
     this page. The guard in app.js is what makes importing it here safe. */
  #stage { position: relative; width: 100%; height: 100%; }

  .widget-error { display: none; }   /* never show fetch errors in a preview */

  /* A widget the preview cannot honestly draw says so, rather than showing an
     empty box that reads as "broken". */
  .pw-stub {
    height: 100%; display: flex; flex-direction: column; gap: .8vmin;
    align-items: center; justify-content: center; text-align: center;
    background: repeating-linear-gradient(45deg,
      rgba(255,255,255,.03) 0 10px, rgba(255,255,255,.06) 10px 20px);
    border-radius: var(--radius); color: var(--fg-dim); padding: 1vmin;
  }
  /* A contained video: the largest 16:9 box that fits, centred. */
  .pw-stub-frame { position: absolute; inset: 0; display: grid; place-items: center; container-type: size; }
  .pw-stub.pw-stub--169 {
    width: min(100cqw, 100cqh * 16 / 9);
    height: min(100cqh, 100cqw * 9 / 16);
  }
  .pw-stub .ico { font-size: 4vmin; line-height: 1; }
  .pw-stub .lbl { font-size: 1.6vmin; }
</style>
<link rel="stylesheet" href="../render/board.css">
</head>
<body>
<div id="stage"></div>
<script type="module" src="./preview.js"></script>
</body>
</html>
